function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));}
function norm(s){return (s||"").toLowerCase().trim();}
function resize(){ const r=wrap.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; canvas.width=Math.max(300,Math.floor(r.width*dpr)); canvas.height=Math.max(300,Math.floor(r.height*dpr)); canvas.style.width=r.width+"px"; canvas.style.height=r.height+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);} window.addEventListener("resize",resize); resize();

function screenToWorld(sx,sy){return {x:((sx-W()/2)/zoom)-panX, y:((sy-H()/2)/zoom)-panY};}

function showTip(n, clientX, clientY){ tip.style.opacity=1; tip.style.left=(clientX+12)+"px"; tip.style.top=(clientY+12)+"px"; const html = `<div><b>Reaction (model)</b>: ${esc(n.reaction)}</div>` + `<div><b>Reaction (excel matched)</b>: ${esc(n.excelReaction||"")}</div>` + `<div><b>Enzyme</b>: ${esc(n.enzyme||"")}</div>` + `<div><b>Pathway</b>: ${esc(n.pathway||"")}</div>` + `<div><b>Reaction formula</b>: ${esc(n.formula||"")}</div>`; tip.innerHTML = html; }
